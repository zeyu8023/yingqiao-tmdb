name: Build and publish image
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: python3 -m unittest discover -s tests
      - name: Build and smoke test
        run: |
          docker build --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -t yingqiao:test .
          docker run -d --name relay-test -p 127.0.0.1:18012:8080 -e ADMIN_PASSWORD=ci-smoke-test-password yingqiao:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:18012/health || { docker logs relay-test; exit 1; }
      - name: Export UGOS image
        run: |
          docker tag yingqiao:test yingqiao-tmdb:1.0.6
          docker save yingqiao-tmdb:1.0.6 | gzip > yingqiao-tmdb-1.0.6-amd64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: yingqiao-ugdocker
          path: yingqiao-tmdb-1.0.6-amd64.tar.gz
      - name: Publish to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSION="v$(python3 -c 'from app import VERSION; print(VERSION)')"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag yingqiao:test "$image:latest"
          docker tag yingqiao:test "$image:${VERSION}"
          docker push "$image:${VERSION}"
          docker push "$image:latest"
